# FFmpeg Encoding Settings
function:
 -function: ffmpeg_AV1

HDR_enable:
 -HDR_enable: true

FS_enable: 
 -FS_enable: true

# Video settings
video:
  --preset: 7 #3
  --tune: 0
  --sharpness: 2
  --complex-hvs: 1
  --hbd-mds: 1
  --film-grain: 4
  --film-grain-denoise: 0


test_settings:
 cq_threashold: 1.6
 res_decode:
  854: !!float -10
  1280: !!float -1e-04
  1920: !!float -6.9e-05
  3840: !!float -3e-05
 defalut_cq: 30 #32

Deband_enable:
 -Deband_enable: true

Deband:
 -script: deband.vpy
 -range: 15
 -thr: 0.5
 -sample_mode: 2
 -grain: 0
 -seed: 1
 -dynamic_grain: false
 